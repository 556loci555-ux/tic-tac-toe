<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крестики-нолики против бота</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 { margin-bottom: 10px; }

    #status {
      min-height: 30px;
      margin-bottom: 24px;
      font-size: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 16px;
      background: #374151;
      color: white;
      font-size: clamp(48px, 16vw, 76px);
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cell.x { color: #60a5fa; }
    .cell.o { color: #fbbf24; }
    .cell.win { background: #166534; }

    #restart {
      margin-top: 25px;
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Крестики-нолики</h1>
    <p id="status" aria-live="polite">Твой ход: X</p>

    <div class="board" id="board"></div>

    <button id="restart">Начать заново</button>
  </main>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const restartButton = document.getElementById("restart");

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const cells = [];

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.setAttribute("aria-label", `Клетка ${i + 1}`);
      cell.addEventListener("click", () => playerMove(i));
      boardElement.appendChild(cell);
      cells.push(cell);
    }

    let board = Array(9).fill("");
    let gameOver = false;
    let botThinking = false;
    let botTimer = null;

    function winningLineFor(mark) {
      return winningLines.find(line =>
        line.every(index => board[index] === mark)
      );
    }

    function finishIfNeeded(mark) {
      const line = winningLineFor(mark);

      if (line) {
        statusElement.textContent =
          mark === "X" ? "Ты победил! 🎉" : "Бот победил!";
        line.forEach(index => cells[index].classList.add("win"));
        gameOver = true;
        return true;
      }

      if (board.every(value => value !== "")) {
        statusElement.textContent = "Ничья!";
        gameOver = true;
        return true;
      }

      return false;
    }

    function placeMark(index, mark) {
      board[index] = mark;
      cells[index].textContent = mark;
      cells[index].classList.add(mark.toLowerCase());
      cells[index].setAttribute(
        "aria-label",
        `Клетка ${index + 1}: ${mark}`
      );
    }

    function playerMove(index) {
      if (gameOver || botThinking || board[index] !== "") return;

      placeMark(index, "X");
      if (finishIfNeeded("X")) return;

      botThinking = true;
      statusElement.textContent = "Бот думает…";

      botTimer = setTimeout(() => {
        botTimer = null;
        const move = bestBotMove();
        placeMark(move, "O");
        botThinking = false;

        if (!finishIfNeeded("O")) {
          statusElement.textContent = "Твой ход: X";
        }
      }, 400);
    }

    function bestBotMove() {
      let bestScore = -Infinity;
      let bestMove = -1;

      for (let i = 0; i < 9; i++) {
        if (board[i] !== "") continue;

        board[i] = "O";
        const score = minimax(false, 0);
        board[i] = "";

        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }

      return bestMove;
    }

    function minimax(botTurn, depth) {
      if (winningLineFor("O")) return 10 - depth;
      if (winningLineFor("X")) return depth - 10;
      if (board.every(value => value !== "")) return 0;

      let bestScore = botTurn ? -Infinity : Infinity;

      for (let i = 0; i < 9; i++) {
        if (board[i] !== "") continue;

        board[i] = botTurn ? "O" : "X";
        const score = minimax(!botTurn, depth + 1);
        board[i] = "";

        bestScore = botTurn
          ? Math.max(bestScore, score)
          : Math.min(bestScore, score);
      }

      return bestScore;
    }

    restartButton.addEventListener("click", () => {
      if (botTimer !== null) clearTimeout(botTimer);

      botTimer = null;
      board = Array(9).fill("");
      gameOver = false;
      botThinking = false;
      statusElement.textContent = "Твой ход: X";

      cells.forEach((cell, index) => {
        cell.textContent = "";
        cell.className = "cell";
        cell.setAttribute("aria-label", `Клетка ${index + 1}`);
      });
    });
  </script>
</body>
</html>
